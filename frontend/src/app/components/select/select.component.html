<div class="app-select" [class.open]="open" [class.disabled]="disabled" [class.invalid]="invalid">
  <button
    type="button"
    class="app-select__trigger"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel || placeholder"
    [attr.aria-invalid]="invalid"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)"
  >
    <span class="app-select__label" [class.placeholder]="!selected">{{ displayLabel }}</span>
    <span class="app-select__chevron" aria-hidden="true"></span>
  </button>

  @if (open) {
    <ul class="app-select__menu" role="listbox">
      @for (option of options; track $index; let i = $index) {
        <li
          role="option"
          class="app-select__option"
          [class.selected]="option.value === value"
          [class.active]="i === activeIndex"
          [class.disabled]="option.disabled"
          [attr.aria-selected]="option.value === value"
          (mousedown)="$event.preventDefault(); selectOption(option)"
        >
          {{ option.label }}
        </li>
      }
    </ul>
  }
</div>
