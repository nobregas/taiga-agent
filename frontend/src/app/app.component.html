<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">TA</div>
      <div>
        <h1>Taiga Agent</h1>
        <p>US + tasks com IA</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Wizard</a>
      <a routerLink="/workspaces" routerLinkActive="active">Workspaces</a>
      <a routerLink="/settings" routerLinkActive="active">Configuracoes</a>
    </nav>

    @if (workspaces.length) {
      <label class="workspace-switch">
        <span>Workspace</span>
        <select
          [value]="meta?.workspaceId ?? ''"
          [disabled]="switchingWorkspace"
          (change)="onWorkspaceChange($event)"
        >
          @for (workspace of workspaces; track workspace.id) {
            <option [value]="workspace.id" [selected]="workspace.id === meta?.workspaceId">
              {{ workspace.name }}
            </option>
          }
        </select>
      </label>
    }

    @if (meta) {
      <div class="meta-card">
        <small>Projeto</small>
        <strong>{{ meta.projectSlug }}</strong>
        @if (meta.currentUser) {
          <small>Assignee: {{ meta.currentUser.full_name }}</small>
        }
        <div class="status-row">
          <span [class.on]="meta.geminiConfigured">Gemini</span>
          <span [class.on]="meta.gitlabConfigured">GitLab</span>
        </div>
      </div>
    }
  </aside>

  <main class="main">
    <router-outlet />
  </main>
</div>

<app-toast />
