services:
  app:
    image: ghcr.io/nobregas/taiga-agent:latest
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    ports:
      - "4200:3000"
    volumes:
      - taiga-data:/data
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      FRONTEND_DIST: /app/public
      TAIGA_AGENT_DATA_DIR: /data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

volumes:
  taiga-data:
